name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, such as v0.2; leave empty to build the selected branch"
        required: false
      publish:
        description: "Publish or update the GitHub Release for the tag"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build release binary
        run: swift build -c release

      - name: Run compatibility tests against release binary
        run: REWRAP_MARKDOWN_EXECUTABLE="$PWD/.build/release/rewrap-markdown" swift test

      - name: Stage binary
        run: |
          version=$(cat VERSION)
          mkdir -p artifact
          cp .build/release/rewrap-markdown "artifact/rewrap-markdown-${version}-macos-${{ matrix.arch }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rewrap-markdown-macos-${{ matrix.arch }}
          path: artifact/*
          if-no-files-found: error

  package-macos:
    name: Build universal macOS installer
    needs: build-macos
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download architecture binaries
        uses: actions/download-artifact@v8
        with:
          pattern: rewrap-markdown-macos-*
          path: architecture-binaries
          merge-multiple: true

      - name: Create universal executable
        run: |
          version=$(cat VERSION)
          mkdir -p artifact
          lipo -create \
            "architecture-binaries/rewrap-markdown-${version}-macos-x86_64" \
            "architecture-binaries/rewrap-markdown-${version}-macos-arm64" \
            -output artifact/rewrap-markdown-universal
          lipo artifact/rewrap-markdown-universal -verify_arch x86_64 arm64

      - name: Build and verify unsigned installer
        run: |
          make package-unsigned RELEASE_BINARY="$PWD/artifact/rewrap-markdown-universal"
          EXPECTED_ARCHS="x86_64 arm64" Packaging/pkg/verify-installer.sh "dist/rewrap-markdown-$(cat VERSION)-unsigned.pkg"

      - name: Create installer checksum
        run: |
          package="rewrap-markdown-$(cat VERSION)-unsigned.pkg"
          (cd dist && shasum -a 256 "$package" > "$package.sha256")

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: rewrap-markdown-macos-installer
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, package-macos]
    if: github.event_name == 'push' || (inputs.publish && inputs.tag != '')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Add script assets
        run: |
          version=$(cat VERSION)
          cp Reference/rewrap_markdown.py "dist/rewrap-markdown-${version}.py"
          cp "Distribution/BBEdit/Rewrap Markdown (Swift)" "dist/Rewrap-Markdown-Swift"
          cp "Distribution/BBEdit/Markdown Hard Wrap Menu Action.applescript" "dist/Markdown-Hard-Wrap-Menu-Action.applescript"
          chmod +x "dist/rewrap-markdown-${version}.py" "dist/Rewrap-Markdown-Swift"

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          title="Rewrap Markdown ${TAG_NAME#v}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            gh release edit "$TAG_NAME" --title "$title" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" dist/* --verify-tag --title "$title" --notes-file RELEASE_NOTES.md
          fi
